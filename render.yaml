# Render Blueprint Specification for Contexta
# https://render.com/docs/blueprint-spec
services:
  # 1. FastAPI NLP Engine Service
  - type: web
    name: contexta-nlp-engine
    runtime: python
    rootDir: nlp-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free

  # 2. Express.js API Gateway Service
  - type: web
    name: contexta-api-gateway
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NLP_ENGINE_URL
        fromService:
          type: web
          name: contexta-nlp-engine
          property: host
      - key: CLIENT_ORIGIN
        value: "*"

  # 3. React Frontend Website (Static Site - Free & Fast)
  - type: web
    name: contexta-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://contexta-api-gateway.onrender.com/api

